# Keep Apache from warning about a missing FQDN in the container.
ServerName localhost

# Laravel front controller lives in public/, so Apache must be allowed to read
# .htaccess there and route every unknown path to index.php.
<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Pass the real scheme through the reverse proxy (nginx) in front of Apache.
SetEnvIf X-Forwarded-Proto https HTTPS=on
